<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink Donation Button Generator</title>
    <meta name="robots" content="noindex">
    <!--
        GitHub Pages has no server-side routing: it serves static files by exact
        path and falls back to this 404.html for anything it can't match. We use
        that to support username-customized deep links, e.g.

            https://donation-button.blink.sv/pretyflaco

        (linked from the Blink mobile app's "Ways to get paid" section).

        This page captures the requested path, stashes the candidate username in
        sessionStorage, and redirects to "/", where js/generator.js reads it and
        auto-generates that user's donation button. If the path isn't a plausible
        single-segment username, we just send the visitor to the generator home.

        Kept dependency-free and inline so it runs before any render.
    -->
    <script>
        (function () {
            // Mirror of parseUsernameFromPath() in js/generator.js — keep the two
            // in sync. A valid deep link is a single path segment that is not a
            // file and not a reserved site path.
            function parseUsernameFromPath(pathname) {
                if (typeof pathname !== 'string') return null;

                var trimmed = pathname.replace(/^\/+/, '').replace(/\/+$/, '');
                if (trimmed === '') return null;
                if (trimmed.indexOf('/') !== -1) return null;

                var segment;
                try {
                    segment = decodeURIComponent(trimmed);
                } catch (e) {
                    return null;
                }

                // Looks like a file (has an extension) -> not a username.
                if (/\.[a-z0-9]+$/i.test(segment)) return null;

                // NOTE: keep this reserved list (and the parser rules above)
                // in sync with parseUsernameFromPath() in js/generator.js. The
                // two implementations are intentionally duplicated — this page
                // must be dependency-free and run before render on GitHub Pages,
                // so it can't import the module version. A parity test
                // (tests/generator-deeplink-parity.spec.js) fails CI if they drift.
                var reserved = {
                    index: 1, img: 1, js: 1, css: 1, tests: 1, assets: 1,
                    favicon: 1, robots: 1, sitemap: 1, '404': 1, cname: 1
                };
                if (reserved[segment.toLowerCase()]) return null;

                if (!/^[a-z0-9_]{1,50}$/i.test(segment)) return null;

                return segment;
            }

            var username = parseUsernameFromPath(window.location.pathname);
            if (username) {
                try {
                    sessionStorage.setItem('blinkRedirectUsername', username);
                } catch (e) {
                    // sessionStorage unavailable (e.g. private mode / disabled).
                    // By design we do NOT fall back to a query param — we simply
                    // send the visitor to the generator home, where they can type
                    // their username. This is a deliberate choice (keeps the URL
                    // surface small); it is not a pending feature.
                }
            }

            // Redirect to the generator root. Use replace() so the 404 URL does
            // not linger in history.
            window.location.replace('/');
        })();
    </script>
</head>
<body>
    <noscript>
        <p>
            Page not found. Visit the
            <a href="/">Blink Donation Button Generator</a>.
        </p>
    </noscript>
</body>
</html>
